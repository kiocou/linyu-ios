name: Build iOS

# 空壳验证用：手动触发，以及推 main 时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-15 自带 Xcode 16，能构建 iOS 16+ 的包
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 账单缓存与结算对账回归检查
        run: |
          swiftc -swift-version 5 -parse-as-library \
            LinYu/ApiModels.swift LinYu/BillService.swift LinYu/AppDataStore.swift \
            LinYu/PendingSettlement.swift LinYu/SettlementEngine.swift \
            LinYu/ActiveOrderStore.swift LinYu/MoneyFormat.swift \
            LinYu/ProfileCache.swift LinYu/DeviceStateParser.swift LinYu/LoginFeedback.swift Tests/ParityBatchRegression.swift \
            LinYu/BleRequestFields.swift \
            LinYu/DeviceAddress.swift Tests/DeviceAddressRegression.swift \
            LinYu/SessionWork.swift LinYu/RecoveryArchive.swift LinYu/DeductService.swift Tests/SessionIsolationRegression.swift \
            LinYu/BillHistoryCache.swift LinYu/BleRecoveryStore.swift LinYu/SettlementNoticePolicy.swift \
            LinYu/LogRedactor.swift Tests/ParityFinishRegression.swift \
            Tests/SharedStoreSessionRegression.swift \
            LinYu/UserCardLayout.swift Tests/UserCardLayoutRegression.swift \
            LinYu/BleCallbackGuard.swift Tests/BleCallbackRegression.swift \
            LinYu/BleReplyBuffer.swift Tests/BleReplyBufferRegression.swift \
            LinYu/NotificationPolicy.swift Tests/NotificationFeedbackRegression.swift \
            LinYu/UseCodeQuotaStore.swift \
            LinYu/DeviceControlPolicy.swift LinYu/CloudShower.swift Tests/DeviceControlRegression.swift \
            Tests/DataStoreSupport.swift Tests/DataStoreRegression.swift \
            Tests/SettlementRegression.swift Tests/CoreLogicRegression.swift \
            -o "$RUNNER_TEMP/linyu-data-tests"
          "$RUNNER_TEMP/linyu-data-tests"
          swiftc -swift-version 5 -parse-as-library \
            LinYu/ApiModels.swift LinYu/ApiClient.swift LinYu/LoginFeedback.swift LinYu/SessionWork.swift Tests/NetworkRegression.swift \
            -o "$RUNNER_TEMP/linyu-network-tests"
          "$RUNNER_TEMP/linyu-network-tests"
          swiftc -swift-version 5 -parse-as-library \
            LinYu/ApiModels.swift LinYu/LoginFeedback.swift LinYu/DeviceInfoDisplay.swift Tests/DeviceDisplayRegression.swift \
            -o "$RUNNER_TEMP/linyu-display-tests"
          "$RUNNER_TEMP/linyu-display-tests"
          swiftc -swift-version 5 -parse-as-library \
            WidgetShared/WidgetSnapshot.swift Tests/WidgetRegression.swift \
            -o "$RUNNER_TEMP/linyu-widget-tests"
          "$RUNNER_TEMP/linyu-widget-tests"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 构建未签名 Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LinYu.xcodeproj \
            -scheme LinYu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LinYu.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: 组件离线布局截图
        run: |
          set -euo pipefail
          xcodebuild build -project LinYu.xcodeproj -scheme LinYu -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO > build/simulator-build.log 2>&1 || { tail -100 build/simulator-build.log; exit 1; }
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" build/Simulator/Build/Products/Debug-iphonesimulator/LinYu.app
          mkdir -p build/widget-previews
          for MODE in idle running nearby bills; do
            xcrun simctl terminate "$SIM" com.hualala.linyu || true
            xcrun simctl launch "$SIM" com.hualala.linyu --widget-preview "--preview-$MODE"
            sleep 3
            xcrun simctl io "$SIM" screenshot "build/widget-previews/$MODE.png"
          done

      - name: 上传组件布局截图
        uses: actions/upload-artifact@v4
        with:
          name: LinYu-widget-previews
          path: build/widget-previews

      - name: 校验产物并打包成 ipa
        run: |
          set -euo pipefail
          APP="build/LinYu.xcarchive/Products/Applications/LinYu.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没有找到 LinYu.app，Archive 可能失败了"
            find build -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "产物大小：$(du -sh "$APP" | cut -f1)"
          EXT="$APP/PlugIns/LinYuWidgets.appex"
          test -f "$EXT/LinYuWidgets"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.widgetkit-extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT/Info.plist")" = "18"

          # 未签名 ipa 的标准结构就是 Payload/<App>.app
          rm -rf build/Payload build/LinYu-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry LinYu-unsigned.ipa Payload

          echo "ipa 大小：$(du -sh LinYu-unsigned.ipa | cut -f1)"
          unzip -l LinYu-unsigned.ipa | head -20

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: LinYu-unsigned-ipa
          path: build/LinYu-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
