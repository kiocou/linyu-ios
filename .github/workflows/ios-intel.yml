name: Build iOS (Intel runner)

# macOS(arm64) 托管机在高峰时段会排队到拿不到机器（"job was not acquired"）。
# 这条流水线走 Intel 的 macos-13，只做 archive + 打包 ipa，用来兜底出包。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 构建未签名 Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LinYu.xcodeproj \
            -scheme LinYu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LinYu.xcarchive \
            CODE_SIGN_IDENTITY="" \
            LINYU_SOURCE_REVISION="$GITHUB_SHA" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP="build/LinYu.xcarchive/Products/Applications/LinYu.app"
          EXT="$APP/PlugIns/LinYuWidgets.appex"
          test -f "$EXT/LinYuWidgets"
          codesign --force --sign - --timestamp=none --entitlements WidgetExtension/LinYuWidgets.entitlements "$EXT"
          codesign --force --sign - --timestamp=none --entitlements LinYu/LinYu.entitlements "$APP"
          rm -rf build/Payload build/LinYu-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry LinYu-unsigned.ipa Payload && ls -l LinYu-unsigned.ipa
      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: LinYu-unsigned-ipa-intel
          path: build/LinYu-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
